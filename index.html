<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Block Comparator</title>
    <!-- SheetJS library for reading Excel (.xlsx/.xls) files in browser -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; }
        h1, h2, h3 { color: #333; }
        table { border-collapse: collapse; width: 100%; margin: 15px 0 25px 0; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; }
        .overlap { background-color: #ddffdd !important; font-weight: bold; }
        .absent { background-color: #ffcccc !important; font-weight: bold; color: #900000; }
        .no-overlap { background-color: #ffdddd !important; }
        .controls, .block-manager, .history-log-box { margin: 20px 0; padding: 15px; background: white; border: 1px solid #ddd; border-radius: 6px; }
        button { margin: 5px; padding: 8px 16px; cursor: pointer; }
        input[type="date"], input[type="time"], input[type="text"], select { padding: 6px; font-size: 0.95em; }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0; }
        .checkbox-group label { display: flex; align-items: center; gap: 4px; }
        .block-list { margin-top: 10px; }
        .block-item { padding: 10px; margin: 6px 0; background: #f0f0f0; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        #status { margin: 10px 0; color: #d32f2f; }
        .summary { font-weight: bold; margin: 15px 0; font-size: 1.1em; }
        .attendance { font-size: 1.4em; color: #0066cc; margin: 20px 0; padding: 15px; background: white; border: 2px solid #0066cc; border-radius: 8px; text-align: center; }
        .file-inputs { display: flex; flex-direction: column; gap: 10px; margin: 15px 0; }
        .file-input-group { background: #fdfdfd; padding: 10px; border: 1px dashed #ccc; border-radius: 4px; }
        .status-msg { margin-top: 5px; font-weight: bold; color: #2e7d32; }
        .badge-cancelled { background: #dc3545; color: #fff; padding: 3px 6px; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
        .badge-completed { background: #198754; color: #fff; padding: 3px 6px; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
        .badge-in-block { background: #0d6efd; color: #fff; padding: 3px 6px; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
        .badge-out-block { background: #6c757d; color: #fff; padding: 3px 6px; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
        .semester-picker-box { background: #eef6ff; border: 1px solid #b6d4fe; padding: 12px; border-radius: 6px; margin-bottom: 15px; }
        
        /* Execution Log Styling */
        .history-log-box { background: #1e1e1e; color: #00ff66; font-family: 'Courier New', Courier, monospace; }
        .history-log-box h2 { color: #ffffff; border-bottom: 1px solid #444; padding-bottom: 8px; }
        .log-entry { margin-bottom: 10px; padding: 8px; border-bottom: 1px dashed #444; line-height: 1.5em; }
        .log-header { font-weight: bold; color: #ffffff; font-size: 1.05em; background: #2a2a2a; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 6px; }
        .log-rate { color: #00e5ff; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Flight Block Comparator</h1>

    <!-- Flight Block Manager -->
    <div class="block-manager">
        <h2>Flight Block Manager</h2>
        <div>
            <label>Block Name: <input type="text" id="blockName" placeholder="e.g. Morning Block" value="Morning Block"></label><br><br>
            
            <strong>Day(s):</strong>
            <div class="checkbox-group">
                <label><input type="checkbox" value="1" checked> Monday</label>
                <label><input type="checkbox" value="2"> Tuesday</label>
                <label><input type="checkbox" value="3" checked> Wednesday</label>
                <label><input type="checkbox" value="4"> Thursday</label>
                <label><input type="checkbox" value="5" checked> Friday</label>
                <label><input type="checkbox" value="6"> Saturday</label>
                <label><input type="checkbox" value="0"> Sunday</label>
            </div><br>
            
            <label>Start Time: <input type="time" id="blockStart" value="08:30"></label>
            <label>End Time: <input type="time" id="blockEnd" value="11:00"></label><br><br>
            
            <button onclick="addFlightBlock()">Add Flight Block</button>
        </div>
        
        <div class="block-list" id="blockList"></div>
    </div>

    <!-- Main Controls -->
    <div class="controls">
        <!-- USU Semester Quick Selector -->
        <div class="semester-picker-box">
            <label><strong>Select USU Academic Semester:</strong> </label>
            <select id="usuSemesterSelect" onchange="loadUSUSemesterData()">
                <option value="spring2026">USU Spring Semester 2026</option>
                <option value="summer2026" selected>USU Summer Semester 2026</option>
                <option value="fall2026">USU Fall Semester 2026</option>
                <option value="spring2027">USU Spring Semester 2027</option>
                <option value="custom">Custom Date Range</option>
            </select>
            <span id="semesterDataBadge" style="margin-left: 10px; font-size: 0.9em; color: #555;"></span>
        </div>

        <div style="margin-bottom: 15px;">
            <label><strong>Student Name Filter:</strong> <input type="text" id="studentName" placeholder="e.g. Meyer, A." value="" style="width: 220px;"></label>
            <small style="color:#666; margin-left: 8px;">(Matches "Student: [Name]" block headers regardless of spacing)</small>
        </div>

        <div class="file-inputs">
            <div class="file-input-group">
                <label><strong>1. Cancellation Log (.xls, .xlsx):</strong><br>
                <input type="file" id="cancellationFile" accept=".xlsx, .xls" onchange="handleCancellationFile(this)"></label>
                <div id="cancellationStatus" class="status-msg"></div>
            </div>

            <div class="file-input-group">
                <label><strong>2. Flight Activity Logs (.xls, .xlsx):</strong><br>
                <input type="file" id="excelFile" accept=".xlsx, .xls" multiple></label>
            </div>
        </div>

        <label>Semester Start: <input type="date" id="semesterStart"></label>
        <label>Semester End: <input type="date" id="semesterEnd"></label><br><br>

        <button onclick="processFiles()">Load Files & Compare</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>
    
    <div id="status"></div>
    <div id="results"></div>

    <!-- Execution History Log Container -->
    <div class="history-log-box">
        <h2>📜 Execution History Log</h2>
        <button onclick="exportLogToCSV()" style="background:#0066cc; color:#fff; border:none; padding:6px 12px; border-radius:3px; cursor:pointer; font-weight:bold; margin-right:5px;">📥 Export Log (CSV)</button>
        <button onclick="clearRunHistory()" style="background:#444; color:#fff; border:none; padding:6px 12px; border-radius:3px; cursor:pointer;">Clear History</button>
        <div id="executionHistoryList" style="margin-top: 10px;"><em>No runs recorded yet in this session.</em></div>
    </div>

    <script>
        let flightBlocks = [];
        let rawCancellationRows = null; 
        let cancellationRecords = [];
        let noClassDates = [];
        let executionLogData = [];
        let runCount = 0;

        const ABSENT_REGEX = /(student[\s\-_]*(absent|absence|no[\s\-]*show|cancel|sick|unexcused)|canceled\s+by\s+student|student\s+canceled|medical\s*\(\s*absent\s*\))/i;

        const usuSemesters = {
            spring2026: {
                start: '2026-01-05',
                end: '2026-04-21',
                noClass: ['2026-01-19', '2026-02-16', '2026-03-09', '2026-03-10', '2026-03-11', '2026-03-12', '2026-03-13']
            },
            summer2026: {
                start: '2026-05-04',
                end: '2026-08-07',
                noClass: ['2026-05-25', '2026-06-15', '2026-07-03', '2026-07-24']
            },
            fall2026: {
                start: '2026-08-31',
                end: '2026-12-11',
                noClass: ['2026-09-07', '2026-10-09', '2026-11-25', '2026-11-26', '2026-11-27']
            },
            spring2027: {
                start: '2027-01-11',
                end: '2027-04-27',
                noClass: ['2027-01-18', '2027-02-15', '2027-03-08', '2027-03-09', '2027-03-10', '2027-03-11', '2027-03-12']
            }
        };

        function normalizeName(str) {
            if (!str) return '';
            return str.toLowerCase().replace(/\s*,\s*/g, ',').replace(/\s+/g, ' ').trim();
        }

        function loadUSUSemesterData() {
            const selectedKey = document.getElementById('usuSemesterSelect').value;
            const badge = document.getElementById('semesterDataBadge');

            if (selectedKey === 'custom') {
                noClassDates = [];
                badge.innerHTML = '<em>Custom dates enabled. Enter start/end dates manually.</em>';
                return;
            }

            const semData = usuSemesters[selectedKey];
            if (semData) {
                document.getElementById('semesterStart').value = semData.start;
                document.getElementById('semesterEnd').value = semData.end;
                noClassDates = [...semData.noClass];
                badge.innerHTML = `✔ Loaded preset: <strong>${semData.start}</strong> to <strong>${semData.end}</strong> (${noClassDates.length} Academic "no class" dates).`;
            }
        }

        function matchesStudentName(currentStudentText, targetName) {
            if (!targetName) return true;
            if (!currentStudentText) return false;

            const normText = normalizeName(currentStudentText);
            const normTarget = normalizeName(targetName);

            if (normText.includes(normTarget) || normTarget.includes(normText)) return true;

            const targetParts = normTarget.replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(p => p.length > 0);
            return targetParts.length > 0 && targetParts.every(part => normText.includes(part));
        }

        function isOralNormalEntry(str) {
            const normalized = str.toLowerCase().replace(/\s+/g, '');
            return normalized.includes('oral-normal') || normalized.includes('oral/normal');
        }

        function parseFlexibleDate(str) {
            if (!str) return null;
            let dateStr = String(str).trim();

            dateStr = dateStr.replace(/:(\d)\b/g, ':0$1');

            const date = new Date(dateStr);
            return !isNaN(date.getTime()) ? date : null;
        }

        function formatDateKey(dateObj) {
            if (!dateObj) return '';
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function handleCancellationFile(input) {
            const file = input.files[0];
            if (!file) {
                rawCancellationRows = null;
                document.getElementById('cancellationStatus').innerText = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                rawCancellationRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                document.getElementById('cancellationStatus').innerText = 
                    `✔ Cancellation log loaded into memory (${rawCancellationRows.length} rows). Ready to compare.`;
            };
            reader.readAsArrayBuffer(file);
        }

        function parseStoredCancellationData(targetStudent) {
            cancellationRecords = [];
            if (!rawCancellationRows || rawCancellationRows.length === 0) return;

            let currentStudentInFile = ""; 

            rawCancellationRows.forEach(row => {
                if (!Array.isArray(row)) return;
                let rowText = row.map(cell => String(cell || '').trim()).join(' ');

                if (rowText.includes('Student:')) {
                    let studentPart = rowText.split('Student:')[1];
                    if (studentPart) {
                        currentStudentInFile = studentPart.split('/')[0].trim();
                    }
                    return; 
                }

                if (targetStudent && !matchesStudentName(currentStudentInFile, targetStudent)) {
                    return;
                }

                if (isOralNormalEntry(rowText)) return;

                let dateVal = '';
                for (let cellVal of row) {
                    let strVal = String(cellVal || '').trim();
                    if (strVal.toUpperCase().includes('START DATE') || strVal.toUpperCase().includes('STOP DATE')) continue;
                    if (/\d{1,2}\s+[A-Za-z]{3}\s+\d{4}\s+\d{1,2}:\d{1,2}/.test(strVal) && !dateVal) {
                        dateVal = strVal;
                        break;
                    }
                }

                if (!dateVal) return;
                const parsedDate = parseFlexibleDate(dateVal);
                if (!parsedDate) return;

                cancellationRecords.push({
                    dateKey: formatDateKey(parsedDate),
                    rawDate: dateVal,
                    isStudentAbsent: ABSENT_REGEX.test(rowText)
                });
            });
        }

        function renderFlightBlocks() {
            const container = document.getElementById('blockList');
            if (flightBlocks.length === 0) {
                container.innerHTML = '<em>No active flight blocks added yet.</em>';
                return;
            }

            container.innerHTML = '<strong>Active Flight Blocks:</strong><br>';
            flightBlocks.forEach((block, index) => {
                const dayNames = block.days.map(d => ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]).join(', ');
                const div = document.createElement('div');
                div.className = 'block-item';
                div.innerHTML = `
                    <span><strong>${block.name}</strong>: ${dayNames} ${block.start}–${block.end}</span>
                    <button onclick="removeFlightBlock(${index})" style="background:#ff4444;color:white;">Remove</button>
                `;
                container.appendChild(div);
            });
        }

        function addFlightBlock() {
            const name = document.getElementById('blockName').value.trim() || `Block ${flightBlocks.length + 1}`;
            const checkboxes = document.querySelectorAll('.checkbox-group input[type="checkbox"]');
            const selectedDays = Array.from(checkboxes).filter(cb => cb.checked).map(cb => parseInt(cb.value));
            const start = document.getElementById('blockStart').value;
            const end = document.getElementById('blockEnd').value;
            
            if (selectedDays.length === 0 || !start || !end) {
                return alert('Please select at least one day and set times');
            }
            
            flightBlocks.push({ id: Date.now(), name: name, days: selectedDays, start: start, end: end });
            renderFlightBlocks();
            document.getElementById('blockName').value = '';
        }

        function removeFlightBlock(index) {
            if (confirm('Remove this flight block?')) {
                flightBlocks.splice(index, 1);
                renderFlightBlocks();
            }
        }

        function processFiles() {
            const files = document.getElementById('excelFile').files;
            const studentName = document.getElementById('studentName').value.trim();

            if (files.length === 0) return alert('Select Flight Activity Excel file(s)');
            if (flightBlocks.length === 0) return alert('Add at least one flight block');
            
            const startInput = document.getElementById('semesterStart').value;
            const endInput = document.getElementById('semesterEnd').value;

            if (!startInput || !endInput) return alert('Please enter both Semester Start and Semester End dates.');

            const semesterStart = new Date(startInput + 'T00:00:00');
            const semesterEnd = new Date(endInput + 'T23:59:59');
            
            parseStoredCancellationData(studentName);

            document.getElementById('results').innerHTML = '';
            document.getElementById('status').innerHTML = 'Processing...';

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = e => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                        const activities = parseStudentSchedule(rows, studentName);
                        displayResults(file.name, activities, semesterStart, semesterEnd);
                    } catch (err) {
                        document.getElementById('status').innerHTML += `<p>Error: ${err.message}</p>`;
                    }
                };
                reader.readAsArrayBuffer(file);
            });
        }

        function parseStudentSchedule(rows, studentName) {
            const activities = [];
            
            for (let fields of rows) {
                if (!Array.isArray(fields)) continue;
                let lineStr = fields.map(f => String(f || '').trim()).join(' ');

                if (!matchesStudentName(lineStr, studentName)) continue;
                if (!/\d{4}/.test(lineStr)) continue;

                let startStr = null, endStr = null, detectedType = '', status = '', reasonStr = '';

                const activityKeywords = /(flight\s*\/\s*check\s*ride|check\s*ride|dual\s*flight|solo\s*flight|ground\s*school|ground|sim|simulator|stage\s*check|briefing|oral)/i;

                for (let f of fields) {
                    let strF = String(f || '').trim();
                    
                    if (/\d{1,2}\s+[A-Za-z]{3}\s+\d{4}\s+\d{1,2}:\d{1,2}/.test(strF)) {
                        if (!startStr) startStr = strF;
                        else if (!endStr) endStr = strF;
                    }

                    if (['Completed','Cancelled','Scheduled'].includes(strF)) {
                        status = strF;
                    } 
                    
                    if (!detectedType && activityKeywords.test(strF)) {
                        detectedType = strF;
                    }

                    if (!detectedType && strF && !strF.match(/\d{4}/) && strF.length > 2 && !['Completed','Cancelled','Scheduled'].includes(strF) && !strF.toLowerCase().includes('student:')) {
                        detectedType = strF;
                    }

                    if (!reasonStr && (ABSENT_REGEX.test(strF) || strF.toLowerCase().includes('reason') || strF.toLowerCase().includes('weather') || strF.toLowerCase().includes('maintenance'))) {
                        reasonStr = strF;
                    }
                }

                const isCancelled = status === 'Cancelled' || reasonStr.length > 0;
                if (isOralNormalEntry(lineStr) && isCancelled) continue;
                
                if (startStr) {
                    const start = parseFlexibleDate(startStr);
                    const end = endStr ? parseFlexibleDate(endStr) : null;
                    const dateKey = start ? formatDateKey(start) : null;

                    let isStudentAbsent = ABSENT_REGEX.test(lineStr);

                    if (!isStudentAbsent && dateKey) {
                        const match = cancellationRecords.find(c => c.dateKey === dateKey);
                        if (match && match.isStudentAbsent) isStudentAbsent = true;
                    }

                    if (start) {
                        activities.push({
                            description: detectedType || 'Scheduled Activity',
                            activityType: detectedType || 'Flight / General',
                            start: start,
                            end: end,
                            status: status || 'Completed',
                            isStudentAbsent: isStudentAbsent,
                            rawLine: lineStr
                        });
                    }
                }
            }
            return activities;
        }

        function generateExpectedBlockSlots(semesterStart, semesterEnd) {
            const rawBlockDates = [];
            let current = new Date(semesterStart);

            while (current <= semesterEnd) {
                const dateKey = formatDateKey(current);
                if (!noClassDates.includes(dateKey)) {
                    const dayOfWeek = current.getDay();
                    if (flightBlocks.some(b => b.days.includes(dayOfWeek))) {
                        rawBlockDates.push(new Date(current));
                    }
                }
                current.setDate(current.getDate() + 1);
            }

            const slots = [];
            rawBlockDates.forEach(blockDate => {
                const dayOfWeek = blockDate.getDay();
                flightBlocks.forEach(block => {
                    if (block.days.includes(dayOfWeek)) {
                        const [sh, sm] = block.start.split(':').map(Number);
                        const [eh, em] = block.end.split(':').map(Number);

                        const blockStart = new Date(blockDate);
                        blockStart.setHours(sh, sm, 0, 0);

                        const blockEnd = new Date(blockDate);
                        blockEnd.setHours(eh, em, 0, 0);

                        slots.push({ date: new Date(blockDate), blockName: block.name, start: blockStart, end: blockEnd });
                    }
                });
            });

            slots.sort((a, b) => a.start - b.start);
            if (slots.length > 0) slots.shift();
            return slots;
        }

        function displayResults(filename, activities, semStart, semEnd) {
            const blockSlots = generateExpectedBlockSlots(semStart, semEnd);
            let attendedCount = 0;
            let studentAbsentCount = 0;

            // Flag which activities overlap with any scheduled block slot
            activities.forEach(act => {
                const actEnd = act.end || new Date(act.start.getTime() + 60*60*1000);
                act.isWithinBlockWindow = blockSlots.some(slot => (act.start < slot.end && actEnd > slot.start));
            });

            const resultsData = blockSlots.map(slot => {
                const slotDateKey = formatDateKey(slot.date);
                
                // Attendance matching: Strictly check if activity falls inside this block time slot
                const matchingActivity = activities.find(act => {
                    if (!act.start) return false;
                    const actEnd = act.end || new Date(act.start.getTime() + 60*60*1000);
                    return (act.start < slot.end && actEnd > slot.start);
                });

                const cancellationMatch = cancellationRecords.find(c => c.dateKey === slotDateKey && c.isStudentAbsent);

                const isAbsent = (matchingActivity && matchingActivity.isStudentAbsent) || !!cancellationMatch;
                const isFulfilled = !!matchingActivity && !isAbsent;

                if (isFulfilled) attendedCount++;
                if (isAbsent) studentAbsentCount++;

                return { slot: slot, fulfilled: isFulfilled, isAbsent: isAbsent, activity: matchingActivity };
            });

            const totalSlots = blockSlots.length;
            const attendancePct = totalSlots > 0 ? Math.round((attendedCount / totalSlots) * 100) : 0;
            const studentName = document.getElementById('studentName').value.trim() || 'All Students';
            
            let html = `<h2>${filename} (Student: ${studentName})</h2>`;
            html += `<div class="attendance">📊 Flight Block Attendance Rate<br><strong>${attendancePct}%</strong><br><small>${attendedCount} / ${totalSlots} scheduled block slots fulfilled strictly during block times (${studentAbsentCount} marked "Student Absent" - penalized)</small></div>`;
            html += `<p class="summary">Date range: ${semStart.toLocaleDateString()} – ${semEnd.toLocaleDateString()} | Filtered Student: "${studentName}" | Exclusions: Academic No-Class Days (${noClassDates.length} days)</p>`;
            
            // Section 1: Flight Block Attendance Table
            html += `<h3>📅 Flight Block Attendance Comparison</h3>`;
            if (totalSlots === 0) {
                html += `<p>No scheduled flight blocks found in this date range.</p>`;
            } else {
                html += `<table><thead><tr>
                    <th>Date</th>
                    <th>Scheduled Block</th>
                    <th>Block Time</th>
                    <th>Block Fulfilled?</th>
                    <th>Activity Type</th>
                    <th>Excel Activity Details</th>
                    <th>Activity Status</th>
                </tr></thead><tbody>`;

                resultsData.forEach(item => {
                    const dateStr = item.slot.date.toLocaleDateString();
                    const timeStr = `${item.slot.start.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})} - ${item.slot.end.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
                    
                    let rowClass = 'no-overlap';
                    let fulfilledLabel = '❌ NO';
                    let statusBadge = '—';

                    if (item.isAbsent) {
                        rowClass = 'absent';
                        fulfilledLabel = '❌ NO (STUDENT ABSENT)';
                        statusBadge = '<span class="badge-cancelled">Cancelled</span>';
                    } else if (item.fulfilled) {
                        rowClass = 'overlap';
                        fulfilledLabel = '✅ YES';
                        const actStatus = item.activity ? item.activity.status : 'Completed';
                        statusBadge = actStatus === 'Cancelled' ? '<span class="badge-cancelled">Cancelled</span>' : '<span class="badge-completed">Completed</span>';
                    }

                    const actType = item.activity ? item.activity.activityType : '—';
                    const actDetails = item.activity 
                        ? `${item.activity.description} (${item.activity.start.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})})` 
                        : '—';

                    html += `<tr class="${rowClass}">
                        <td>${dateStr}</td>
                        <td>${item.slot.blockName}</td>
                        <td>${timeStr}</td>
                        <td>${fulfilledLabel}</td>
                        <td><strong>${actType}</strong></td>
                        <td>${actDetails}</td>
                        <td>${statusBadge}</td>
                    </tr>`;
                });
                html += `</tbody></table>`;
            }

            // Section 2: All Parsed Activities Loaded from Excel
            html += `<h3>📋 All Loaded Activities (${activities.length} total parsed)</h3>`;
            if (activities.length === 0) {
                html += `<p>No matching activities found in file for this student.</p>`;
            } else {
                html += `<table><thead><tr>
                    <th>#</th>
                    <th>Date</th>
                    <th>Activity Time</th>
                    <th>Activity Type</th>
                    <th>Status</th>
                    <th>Inside Flight Block?</th>
                    <th>Used for Attendance?</th>
                </tr></thead><tbody>`;

                activities.forEach((act, idx) => {
                    const actDateStr = act.start ? act.start.toLocaleDateString() : '—';
                    const actTimeStr = act.start ? `${act.start.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})} ${act.end ? '– ' + act.end.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : ''}` : '—';
                    const actStatusBadge = act.status === 'Cancelled' ? '<span class="badge-cancelled">Cancelled</span>' : '<span class="badge-completed">Completed</span>';
                    
                    const insideBlockBadge = act.isWithinBlockWindow 
                        ? '<span class="badge-in-block">Within Block Time</span>' 
                        : '<span class="badge-out-block">Outside Block Time</span>';

                    const countedForAttendance = (act.isWithinBlockWindow && !act.isStudentAbsent && act.status !== 'Cancelled')
                        ? '✅ YES' 
                        : '❌ NO';

                    html += `<tr>
                        <td>${idx + 1}</td>
                        <td>${actDateStr}</td>
                        <td>${actTimeStr}</td>
                        <td><strong>${act.activityType}</strong></td>
                        <td>${actStatusBadge}</td>
                        <td>${insideBlockBadge}</td>
                        <td><strong>${countedForAttendance}</strong></td>
                    </tr>`;
                });
                html += `</tbody></table>`;
            }

            html += `<hr>`;
            document.getElementById('results').innerHTML += html;
            document.getElementById('status').innerHTML = 'Done.';

            logExecutionRun({
                studentName: studentName,
                filename: filename,
                attendancePct: attendancePct,
                fulfilledCount: attendedCount,
                totalSlots: totalSlots,
                studentAbsentCount: studentAbsentCount,
                semStart: semStart.toLocaleDateString(),
                semEnd: semEnd.toLocaleDateString()
            });
        }

        function logExecutionRun(logData) {
            runCount++;
            const historyContainer = document.getElementById('executionHistoryList');
            if (runCount === 1) historyContainer.innerHTML = '';

            const now = new Date();
            const record = {
                runNumber: runCount,
                timestamp: `${now.toLocaleDateString()} ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`,
                studentName: logData.studentName,
                attendancePct: `${logData.attendancePct}%`,
                fulfilled: `${logData.fulfilledCount}/${logData.totalSlots}`,
                studentAbsences: logData.studentAbsentCount,
                filename: logData.filename,
                dateRange: `${logData.semStart} to ${logData.semEnd}`
            };

            executionLogData.push(record);

            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `
                <div class="log-header">
                    ⏱ ${record.timestamp} | Student: ${record.studentName} | Attendance: <span class="log-rate">${record.attendancePct}</span>
                </div><br>
                <strong>File:</strong> ${record.filename}<br>
                <strong>Stats:</strong> ${record.fulfilled} fulfilled blocks (${record.studentAbsences} penalized student absences)<br>
                <strong>Date Range:</strong> ${record.dateRange} | <strong>Exclusions:</strong> Academic calendar no-class days only
            `;

            historyContainer.prepend(entry);
        }

        function exportLogToCSV() {
            if (executionLogData.length === 0) return alert('No execution logs recorded yet to export.');

            const headers = ["Run Number", "Timestamp", "Student Name", "Attendance Rate", "Fulfilled Blocks", "Student Absences", "File Name", "Date Range"];
            const rows = executionLogData.map(log => [
                log.runNumber,
                `"${log.timestamp}"`,
                `"${log.studentName}"`,
                `"${log.attendancePct}"`,
                `"${log.fulfilled}"`,
                log.studentAbsences,
                `"${log.filename}"`,
                `"${log.dateRange}"`
            ]);

            const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
            const a = document.createElement("a");
            a.setAttribute("href", encodeURI(csvContent));
            a.setAttribute("download", `flight_attendance_history_log.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function clearRunHistory() {
            runCount = 0;
            executionLogData = [];
            document.getElementById('executionHistoryList').innerHTML = '<em>No runs recorded yet in this session.</em>';
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
            document.getElementById('status').innerHTML = '';
            document.getElementById('cancellationFile').value = '';
            document.getElementById('cancellationStatus').innerText = '';
            document.getElementById('studentName').value = '';
            rawCancellationRows = null;
            cancellationRecords = [];
            loadUSUSemesterData();
        }

        window.onload = () => {
            renderFlightBlocks();
            loadUSUSemesterData();
        };
    </script>
</body>
</html>
